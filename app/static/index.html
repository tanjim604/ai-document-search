<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Document Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M10 8h8l5 5v11H10z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f8; --panel: #ffffff; --panel-2: #f1f1f4; --border: #e4e4e9;
  --text: #1c1c21; --muted: #6b6b76; --accent: #4f46e5; --accent-soft: #eceafd;
  --ok: #15803d; --ok-bg: #e6f6ec; --warn: #a16207; --warn-bg: #fdf3d8;
  --bad: #b91c1c; --bad-bg: #fde8e8; --busy: #1d4ed8; --busy-bg: #e5eefe;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171a; --panel: #212125; --panel-2: #2a2a30; --border: #36363d;
    --text: #ececf1; --muted: #9a9aa6; --accent: #8b85ff; --accent-soft: #2b2a4a;
    --ok: #4ade80; --ok-bg: #173324; --warn: #facc15; --warn-bg: #3a3112;
    --bad: #f87171; --bad-bg: #3d1c1c; --busy: #7aa7ff; --busy-bg: #1c2a4a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #17171a; --panel: #212125; --panel-2: #2a2a30; --border: #36363d;
  --text: #ececf1; --muted: #9a9aa6; --accent: #8b85ff; --accent-soft: #2b2a4a;
  --ok: #4ade80; --ok-bg: #173324; --warn: #facc15; --warn-bg: #3a3112;
  --bad: #f87171; --bad-bg: #3d1c1c; --busy: #7aa7ff; --busy-bg: #1c2a4a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
header {
  display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
}
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; flex: none; }
.logo svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linejoin: round; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
header .spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border);
  background: var(--panel); padding: 8px 14px; border-radius: 10px; font-weight: 550;
}
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabs { display: none; }

/* ---------- layout ---------- */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 400px 1fr; }
aside { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.aside-head { padding: 16px 18px 10px; display: flex; align-items: baseline; justify-content: space-between; }
.aside-head h2 { margin: 0; font-size: 14px; font-weight: 650; }
.aside-head span { color: var(--muted); font-size: 13px; }
#filter {
  margin: 0 18px 10px; padding: 9px 12px; border: 1px solid var(--border); background: var(--panel-2);
  color: var(--text); border-radius: 10px; font: inherit; width: calc(100% - 36px);
}
#library { flex: 1; overflow-y: auto; padding: 4px 12px 16px; }

/* ---------- file cards ---------- */
.file {
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 8px 6px;
  background: var(--panel); transition: border-color .15s, box-shadow .15s;
}
.file:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.file.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.file-top { display: flex; gap: 12px; align-items: flex-start; }
.ext {
  flex: none; width: 38px; height: 44px; border-radius: 8px; display: grid; place-items: center;
  font-size: 10px; font-weight: 750; letter-spacing: .04em; color: #fff; text-transform: uppercase;
}
.ext.pdf { background: #dc2626; } .ext.docx { background: #2563eb; } .ext.txt { background: #64748b; }
.ext.csv { background: #0d9488; } .ext.xlsx { background: #16a34a; }
.ext.png, .ext.jpg, .ext.jpeg { background: #9333ea; }
.file-meta { min-width: 0; flex: 1; }
.file-name { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.file-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.badge.indexed { background: var(--ok-bg); color: var(--ok); }
.badge.busy { background: var(--busy-bg); color: var(--busy); }
.badge.ocr_needed { background: var(--warn-bg); color: var(--warn); }
.badge.failed { background: var(--bad-bg); color: var(--bad); }
.spin { display: inline-block; width: 9px; height: 9px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; margin-right: 5px; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
.summary { margin: 10px 0 0; color: var(--text); font-size: 13.5px; opacity: .88; }
.summary.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.summary.none { color: var(--muted); font-style: italic; }
.file-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.link {
  border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 13px;
  padding: 3px 6px; margin-left: -6px; border-radius: 6px; text-decoration: none;
}
.link:hover { background: var(--accent-soft); }
.related { margin-top: 8px; font-size: 12.5px; border-top: 1px dashed var(--border); padding-top: 8px; }
.related div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.related .kind { color: var(--muted); white-space: nowrap; }
.empty-lib { text-align: center; color: var(--muted); padding: 40px 20px; }

/* ---------- chat ---------- */
section.chat { display: flex; flex-direction: column; min-height: 0; position: relative; }
#thread { flex: 1; overflow-y: auto; padding: 28px 20px 10px; }
.col { max-width: 760px; margin: 0 auto; }
.welcome { text-align: center; padding: 8vh 10px 0; }
.welcome .logo { width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 18px; }
.welcome .logo svg { width: 28px; height: 28px; }
.welcome h2 { font-size: 26px; margin: 0 0 8px; letter-spacing: -.02em; }
.welcome p { color: var(--muted); margin: 0 auto 24px; max-width: 480px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 1px solid var(--border); background: var(--panel); padding: 8px 14px; border-radius: 999px; font-size: 13.5px; }
.chip:hover { background: var(--accent-soft); border-color: var(--accent); }
.msg { margin: 0 0 22px; display: flex; gap: 12px; scroll-margin-top: 12px; }
.msg.user { justify-content: flex-end; }
.bubble { background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 18px 18px 4px 18px; max-width: 80%; overflow-wrap: anywhere; white-space: pre-wrap; }
.avatar { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.avatar svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; stroke-linejoin: round; }
.reply { flex: 1; min-width: 0; }
.reply > p { margin: 4px 0 12px; }
.result {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px;
  margin-bottom: 10px; box-shadow: var(--shadow);
}
.result-top { display: flex; align-items: center; gap: 12px; }
.result .ext { width: 32px; height: 38px; font-size: 9px; border-radius: 7px; }
.result h3 { margin: 0; font-size: 15px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.match { font-size: 12px; font-weight: 650; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.match.strong { background: var(--ok-bg); color: var(--ok); }
.match.good { background: var(--busy-bg); color: var(--busy); }
.match.possible { background: var(--panel-2); color: var(--muted); }
.result .summary { margin-top: 10px; }
.excerpt {
  margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel-2);
  border-radius: 0 8px 8px 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere;
}
.excerpt b { color: var(--text); font-weight: 600; }
.typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

.composer-wrap { flex: none; padding: 8px 20px 18px; background: linear-gradient(transparent, var(--bg) 30%); }
.composer {
  max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow);
}
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#prompt {
  flex: 1; border: 0; background: transparent; color: var(--text); font: inherit; resize: none;
  max-height: 160px; padding: 8px 0; outline: none;
}
#prompt::placeholder { color: var(--muted); }
.send { width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--accent); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .4; cursor: default; }
.send svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.hint { max-width: 760px; margin: 6px auto 0; text-align: center; color: var(--muted); font-size: 12px; }

/* ---------- upload overlay + toasts ---------- */
#drop {
  position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); display: none;
  place-items: center; z-index: 50; backdrop-filter: blur(3px);
}
#drop.on { display: grid; }
#drop div { border: 2px dashed var(--accent); border-radius: 22px; padding: 56px 72px; font-size: 20px; font-weight: 600; color: var(--accent); background: var(--panel); }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13.5px; }
.toast.error { border-left-color: var(--bad); } .toast.warn { border-left-color: var(--warn); }

/* ---------- small screens ---------- */
@media (max-width: 860px) {
  body { overflow: auto; }
  main { display: block; flex: 1; min-height: 0; }
  .tabs { display: flex; gap: 4px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 8px; font-weight: 600; color: var(--muted); }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); }
  aside, section.chat { height: 100%; border: 0; }
  body[data-tab="chat"] aside, body[data-tab="library"] section.chat { display: none; }
  body { height: 100dvh; }
  main { overflow: hidden; }
  .btn .label { display: none; }
}
</style>
</head>
<body data-tab="chat">

<header>
  <div class="logo"><svg viewBox="0 0 32 32"><path d="M10 8h8l5 5v11H10z"/><path d="M18 8v5h5"/></svg></div>
  <h1>AI Document Search</h1>
  <div class="spacer"></div>
  <button class="btn primary" id="uploadBtn" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg><span class="label">Upload files</span>
  </button>
  <input type="file" id="fileInput" multiple hidden accept=".pdf,.docx,.txt,.csv,.xlsx,.png,.jpg,.jpeg">
</header>

<div class="tabs" role="tablist">
  <button type="button" data-go="chat" class="on">Ask</button>
  <button type="button" data-go="library">Library</button>
</div>

<main>
  <aside aria-label="Library">
    <div class="aside-head"><h2>Your library</h2><span id="count"></span></div>
    <input id="filter" type="search" placeholder="Filter by name or summary" aria-label="Filter files">
    <div id="library"></div>
  </aside>

  <section class="chat">
    <div id="thread" aria-live="polite">
      <div class="col" id="welcome">
        <div class="welcome">
          <div class="logo"><svg viewBox="0 0 32 32"><path d="M10 8h8l5 5v11H10z"/><path d="M18 8v5h5"/></svg></div>
          <h2>What are you looking for?</h2>
          <p>Describe a document in your own words. No need to remember its filename.</p>
          <div class="chips" id="chips"></div>
        </div>
      </div>
      <div class="col" id="messages"></div>
    </div>
    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="prompt" rows="1" placeholder="Pull up the research paper about AI evolution" aria-label="Ask for a document"></textarea>
        <button class="send" id="send" type="submit" aria-label="Search" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <div class="hint">Enter to search · Shift+Enter for a new line · drop files anywhere to upload</div>
    </div>
  </section>
</main>

<div id="drop"><div>Drop files to upload</div></div>
<div id="toasts" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const BUSY = new Set(["uploaded", "extracting", "extracted", "indexing"]);
const EXAMPLES = [
  "Pull up the research paper about AI evolution",
  "Find the meeting notes",
  "Show me the budget spreadsheet",
  "Which files mention neural networks?",
];
let files = [];
let pollTimer = null;
const logo = '<svg viewBox="0 0 32 32"><path d="M10 8h8l5 5v11H10z"/><path d="M18 8v5h5"/></svg>';

/* ---------- helpers ---------- */
function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) node.append(kid);
  return node;
}
function toast(text, kind = "") {
  const t = el("div", { class: "toast " + kind, text });
  $("toasts").append(t);
  setTimeout(() => t.remove(), 5000);
}
async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let detail = res.statusText;
    try { const body = await res.json(); detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail); } catch {}
    throw new Error(detail);
  }
  return res.json();
}
function when(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function statusBadge(status) {
  if (BUSY.has(status)) return el("span", { class: "badge busy" }, el("i", { class: "spin" }), "Processing");
  const labels = { indexed: "Ready", ocr_needed: "Needs OCR", failed: "Failed" };
  return el("span", { class: "badge " + status, text: labels[status] || status });
}
function extTile(ext) { return el("div", { class: "ext " + ext, text: ext }); }
function openFile(id) { window.open(`/files/${id}/download`, "_blank", "noopener"); }

/* ---------- library ---------- */
function renderLibrary() {
  const q = $("filter").value.trim().toLowerCase();
  const shown = files.filter((f) => !q || f.filename.toLowerCase().includes(q) || (f.summary || "").toLowerCase().includes(q));
  $("count").textContent = files.length ? `${files.length} file${files.length === 1 ? "" : "s"}` : "";
  const box = $("library");
  box.replaceChildren();
  if (!shown.length) {
    box.append(el("div", { class: "empty-lib", text: files.length ? "No files match that filter." : "No documents yet. Upload one to get started." }));
    return;
  }
  for (const f of shown) box.append(fileCard(f));
}
function fileCard(f) {
  const summary = f.summary
    ? el("p", { class: "summary clamp", text: f.summary })
    : el("p", { class: "summary none", text: f.status === "ocr_needed" ? "Scanned file: no text could be read, so it cannot be searched yet." : BUSY.has(f.status) ? "Reading and summarising..." : f.status === "failed" ? "Processing failed." : "No summary." });
  const related = el("div", { class: "related", hidden: "" });
  const actions = el("div", { class: "file-actions" },
    el("button", { class: "link", type: "button", text: "Open", onclick: () => openFile(f.file_id) }),
    f.summary && el("button", { class: "link", type: "button", text: "Full summary", onclick: (e) => { summary.classList.toggle("clamp"); e.target.textContent = summary.classList.contains("clamp") ? "Full summary" : "Collapse"; } }),
    f.status === "indexed" && el("button", { class: "link", type: "button", text: "Related files", onclick: () => toggleRelated(f, related) }),
    (f.status === "failed") && el("button", { class: "link", type: "button", text: "Retry", onclick: () => retry(f.file_id) }),
  );
  return el("div", { class: "file", id: "file-" + f.file_id },
    el("div", { class: "file-top" },
      extTile(f.extension),
      el("div", { class: "file-meta" },
        el("div", { class: "file-name", text: f.filename }),
        el("div", { class: "file-sub" }, statusBadge(f.status), el("span", { text: when(f.created_at) })))),
    summary, actions, related);
}
async function toggleRelated(f, box) {
  if (!box.hidden) { box.hidden = true; return; }
  box.hidden = false;
  box.replaceChildren(el("div", { class: "kind", text: "Loading..." }));
  try {
    const data = await api(`/files/${f.file_id}/similar`);
    const labels = { exact_duplicate: "Exact duplicate", near_duplicate: "Near duplicate", related: "Related" };
    box.replaceChildren();
    if (!data.matches.length) box.append(el("div", { class: "kind", text: "No duplicates or related files." }));
    for (const m of data.matches) {
      box.append(el("div", {},
        el("a", { class: "link", href: "#", text: m.filename, onclick: (e) => { e.preventDefault(); focusFile(m.file_id); } }),
        el("span", { class: "kind", text: `${labels[m.match_type] || m.match_type} · ${Math.round(m.score * 100)}%` })));
    }
  } catch (e) { box.replaceChildren(el("div", { class: "kind", text: "Could not load related files." })); }
}
async function retry(id) {
  try { await api(`/files/${id}/process`, { method: "POST" }); } catch (e) { toast(e.message, "error"); }
  loadFiles();
}
function focusFile(id) {
  $("filter").value = "";
  renderLibrary();
  if (document.body.dataset.tab === "chat" && matchMedia("(max-width: 860px)").matches) setTab("library");
  const node = $("file-" + id);
  if (!node) return;
  node.scrollIntoView({ behavior: "smooth", block: "center" });
  node.classList.add("flash");
  setTimeout(() => node.classList.remove("flash"), 1800);
}
async function loadFiles() {
  try { files = await api("/files?limit=500"); } catch (e) { toast("Could not load your files: " + e.message, "error"); return; }
  renderLibrary();
  clearTimeout(pollTimer);
  if (files.some((f) => BUSY.has(f.status))) pollTimer = setTimeout(loadFiles, 2000);
}

/* ---------- upload ---------- */
async function uploadAll(list) {
  const items = [...list];
  if (!items.length) return;
  for (const file of items) {
    const body = new FormData();
    body.append("file", file);
    try {
      const r = await api("/files", { method: "POST", body });
      if (r.is_exact_duplicate) {
        const original = files.find((f) => f.file_id === r.duplicate_of);
        toast(`${file.name} is an exact copy of ${original ? original.filename : "a file you already have"}.`, "warn");
      } else toast(`Uploaded ${file.name}. Reading it now...`);
    } catch (e) { toast(`${file.name}: ${e.message}`, "error"); }
  }
  await loadFiles();
}
$("uploadBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = (e) => { uploadAll(e.target.files); e.target.value = ""; };
let dragDepth = 0;
addEventListener("dragenter", (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { dragDepth++; $("drop").classList.add("on"); } });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").classList.remove("on"); } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; $("drop").classList.remove("on"); uploadAll(e.dataTransfer.files); });

/* ---------- chat ---------- */
function highlight(text, query) {
  const words = [...new Set(query.toLowerCase().split(/\W+/).filter((w) => w.length > 3))];
  const frag = document.createDocumentFragment();
  if (!words.length) { frag.append(text); return frag; }
  const re = new RegExp("(" + words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  text.split(re).forEach((part, i) => frag.append(i % 2 ? el("b", { text: part }) : part));
  return frag;
}
function matchLabel(score) {
  if (score >= 0.5) return ["strong", "Strong match"];
  if (score >= 0.35) return ["good", "Good match"];
  return ["possible", "Possible match"];
}
function resultCard(r, query) {
  const [kind, label] = matchLabel(r.score);
  return el("div", { class: "result" },
    el("div", { class: "result-top" }, extTile(r.extension), el("h3", { text: r.filename }), el("span", { class: "match " + kind, text: `${label} · ${Math.round(r.score * 100)}%` })),
    r.summary && el("p", { class: "summary", text: r.summary }),
    r.matched_excerpt && el("div", { class: "excerpt" }, "…", highlight(r.matched_excerpt, query)),
    el("div", { class: "file-actions" },
      el("button", { class: "link", type: "button", text: "Open file", onclick: () => openFile(r.file_id) }),
      el("button", { class: "link", type: "button", text: "Show in library", onclick: () => focusFile(r.file_id) })));
}
function scrollDown() { const t = $("thread"); t.scrollTop = t.scrollHeight; }
function scrollToAnswer(node) { node.scrollIntoView({ behavior: "smooth", block: "start" }); }
async function ask(query) {
  query = query.trim();
  if (!query) return;
  $("welcome").hidden = true;
  const messages = $("messages");
  messages.append(el("div", { class: "msg user" }, el("div", { class: "bubble", text: query })));
  const reply = el("div", { class: "reply" }, el("div", { class: "typing" }, el("span"), el("span"), el("span")));
  const answer = el("div", { class: "msg" }, avatar(), reply);
  messages.append(answer);
  scrollDown();
  try {
    const data = await api("/search?" + new URLSearchParams({ q: query, limit: 5 }));
    reply.replaceChildren();
    if (!data.results.length) {
      const processing = files.some((f) => BUSY.has(f.status));
      reply.append(el("p", { text: files.some((f) => f.status === "indexed")
        ? "I couldn't find a document that matches that. Try describing its topic in different words." + (processing ? " Some files are still being processed." : "")
        : "There is nothing to search yet. Upload a document first." }));
    } else {
      reply.append(el("p", { text: data.results.length === 1 ? "I found this document:" : `I found ${data.results.length} documents, best match first:` }));
      data.results.forEach((r) => reply.append(resultCard(r, query)));
    }
  } catch (e) {
    reply.replaceChildren(el("p", { text: "Search failed: " + e.message }));
  }
  scrollToAnswer(answer);  // show the best match first, not the last card
}
function avatar() { const a = el("div", { class: "avatar" }); a.innerHTML = logo; return a; }

const prompt_ = $("prompt");
function sync() {
  prompt_.style.height = "auto";
  prompt_.style.height = Math.min(prompt_.scrollHeight, 160) + "px";
  $("send").disabled = !prompt_.value.trim();
}
prompt_.addEventListener("input", sync);
prompt_.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = prompt_.value;
  prompt_.value = ""; sync();
  ask(q);
});
for (const text of EXAMPLES) $("chips").append(el("button", { class: "chip", type: "button", text, onclick: () => ask(text) }));
$("filter").addEventListener("input", renderLibrary);

/* ---------- mobile tabs ---------- */
function setTab(name) {
  document.body.dataset.tab = name;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.go === name));
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.go)));

loadFiles();
prompt_.focus();
const startQuery = new URLSearchParams(location.search).get("q");  // /?q=... runs a search on load
if (startQuery) ask(startQuery);
</script>
</body>
