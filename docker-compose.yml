# Starts the whole system:  docker compose up --build
# API docs:                 http://localhost:8000/docs
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_docs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_docs}   # override in .env, never commit real values
      POSTGRES_DB: ai_docs
    ports:
      - "127.0.0.1:5432:5432"   # this computer only: not reachable from the network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_docs -d ai_docs"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"   # this computer only: Qdrant has no password
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://ai_docs:${POSTGRES_PASSWORD:-ai_docs}@postgres:5432/ai_docs
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""            # empty = use the Qdrant server above, not an embedded folder
      UPLOAD_DIR: /data/uploads   # only used to read files saved before the switch to the database
      STORAGE_BACKEND: database   # uploaded files are stored inside PostgreSQL
      APP_PASSWORD: ${APP_PASSWORD:-}   # set in .env to require a password (use this before sharing a link)
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  # Optional web page for browsing the database: docker compose --profile tools up -d adminer
  # then open http://localhost:8080 (server: postgres, user/database: ai_docs). This computer only.
  adminer:
    image: adminer:4
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres   # pre-fills the Server box (the image default is "db")
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
